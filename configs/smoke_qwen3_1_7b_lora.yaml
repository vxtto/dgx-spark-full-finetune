# SMOKE TEST — not an experiment. Proves the pipeline runs end to end.
#
# Smallest model in the SAME family as the real run (Qwen3), so the chat template
# and tokenization path are identical — a smoke test on a different family would
# not exercise the same code. Trains on 64 samples for 20 steps.
#
# Purpose, in order:
#   1. the environment works at all (see docs/environment.md)
#   2. the dataset loads and the right config is selected
#   3. LoRA attaches and the trainable-parameter count is sane
#   4. loss decreases
#   5. a tokens/sec number to extrapolate the real run from
#
# Should finish in minutes. If it does not, do not start the 8B run.
#
#   bash scripts/run_sft.sh configs/smoke_qwen3_1_7b_lora.yaml
#
exp_name: smoke_qwen3_1_7b_lora
output_dir: runs/smoke_qwen3_1_7b_lora
do_not_randomize_output_dir: true      # keep the path predictable for the run log

# --- Model ---------------------------------------------------------------
# The post-trained instruct release, NOT Qwen3-8B-Base. Issue #1: "Do not select
# a base huggingface checkpoint, start from a post trained release."
model_name_or_path: Qwen/Qwen3-1.7B
tokenizer_name_or_path: Qwen/Qwen3-1.7B
chat_template_name: null               # null => use the model's own chat template
trust_remote_code: false
add_bos: false                         # Qwen templates already emit their own prefix

# Attention is NOT configurable here — open-instruct auto-detects it and will
# resolve to SDPA on this box. See docs/environment.md §4.
# PAPER: flash attention 3. Uncontrolled divergence, recorded in D-04.

# --- Data ----------------------------------------------------------------
# Paper §3.3: 2.2k environments x 8 trajectories, teacher Qwen 3.6 27B.
# Source: allenai/tmax-sft, config "..._thinking_all" (10,726 trajectories).
#
# This is a LOCAL PARQUET PATH, not a hub id, and that is deliberate.
# open-instruct's DatasetConfig calls load_dataset() without a `name=`
# argument, so it cannot select a config of a multi-config dataset —
# allenai/tmax-sft has two configs and no default, and pointing the mixer at
# the hub id raises "Config name is missing". It does accept local .parquet.
# The snapshot also satisfies AGENTS.md §5 ("one config file plus one data
# snapshot").
#
# Create it first:
#   python scripts/prepare_dataset.py --variant all --stats
#
# D-06: "_all" keeps failed rollouts, which is what the paper does (§D.2).
# The "only_success" variant (5,795 rows) is the rejection-sampled ablation:
#   python scripts/prepare_dataset.py --variant only_success
# and swap the path below. That is the only change needed between the two.
dataset_mixer_list:
  - data/processed/tmax_sft_all.parquet
  - "1.0"
dataset_mixer_list_splits:
  - train                              # local parquet supports train only
dataset_cache_mode: local
dataset_local_cache_dir: local_dataset_cache

max_seq_length: 4096
                                       # Halved for memory and wall-clock on one
                                       # device. Agentic traces are long — check
                                       # how many get truncated before accepting.
over_length_strategy: truncate

# --- LoRA ----------------------------------------------------------------
# NOT from the paper — TMAX full-fine-tunes. open-instruct defaults are r=64 /
# alpha=16 (scaling 0.25, unusual). We start low-rank instead, following the
# argument in docs/theory/behaviour-vs-knowledge.md §5 that Terminal-Bench
# failures are behavioural and need little capacity. UNTESTED HYPOTHESIS — the
# first thing to sweep if the run underfits.
use_lora: true
use_qlora: false                       # 128 GB unified: no quantization needed
lora_rank: 16
lora_alpha: 32                         # scaling alpha/r = 2.0
lora_dropout: 0.05

# --- Optimization --------------------------------------------------------
learning_rate: 1.0e-4                  # PAPER: 2e-5, which is a full-FT rate.
                                       # LoRA trains only the adapter and wants
                                       # roughly 5x more.
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
clip_grad_norm: 1.0
num_train_epochs: 1
max_train_samples: 64             # smoke only
max_train_steps: 20               # smoke only — hard stop

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
                                       # We have 1 device, so global batch is 32.
                                       # Matching 128 would quadruple step time.
gradient_checkpointing: true

# --- Checkpointing & logging ---------------------------------------------
checkpointing_steps: "10"
keep_last_n_checkpoints: 2             # adapters are small, but the Spark's disk
                                       # is not infinite
seed: 42

logging_steps: 1                       # this run has few optimizer steps — see
                                       # run_sft.sh output; log every one of them
with_tracking: false
report_to: null
wandb_project_name: llm-training-spark

push_to_hub: false                     # open-instruct defaults this to TRUE —
                                       # keep it off, weights never leave the box
                                       # without a deliberate decision (§5)
try_launch_beaker_eval_jobs: false     # MUST be false. Defaults to true, and
                                       # finetune.py raises at startup on
                                       # "try_launch_beaker_eval_jobs and not
                                       # push_to_hub". Beaker is Ai2-internal.
timeout: 3600
